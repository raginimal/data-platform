name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Gate 2 - Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run lint hooks
        run: bash scripts/lint.sh
      - name: Run tests
        run: bash scripts/test.sh
